# BEGIN_KITTY_FONTS
font_family      family="AdwaitaMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size                       12.0
window_padding_width            10
background_opacity              0.3
scrollback_lines                5000
scrollback_pager_history_size   10
mouse_hide_wait                 2.0
hide_window_decorations         yes
tab_bar_style                   powerline
tab_powerline_style             round

cursor_trail                    200
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshhold   2

# Tux-logo
window_logo_path                ~/dotfiles/kitty/.config/kitty/tux.png
widow_logo_position             bottom-right
window_logo_alpha               0.4
window_logo_scale               20
allow_remote_control            yes
listen_on unix:/tmp/kitty

# loading theme
include ~/dotfiles/generated-colors/kitty.conf
